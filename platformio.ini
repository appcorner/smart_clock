[platformio]
default_envs = release
; ซอร์สอยู่ในโฟลเดอร์เดิม เพื่อให้ยังเปิดด้วย Arduino IDE ได้ด้วย
src_dir = smart_clock_esp8266

; การตั้งค่าพื้นฐานที่แชร์ร่วมกันในทุก Environment
[env]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
; ไม่ใช้ filesystem เพราะหน้าเว็บฝังไว้ใน PROGMEM แล้ว
; แบ่ง 1MB ให้ FS ที่เหลือเป็น sketch space เพื่อให้ OTA มีที่พอ
board_build.ldscript = eagle.flash.4m1m.ld
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit BusIO @ ^1.15.0
    bodmer/TJpg_Decoder @ ^1.1.0
; หลัง build เสร็จ copy firmware.bin ไปไว้ที่ build_esp8266/ ตามที่ README อ้างถึง
extra_scripts = post:scripts/copy_firmware.py
build_flags =
    -Wno-deprecated-declarations

; ====================================================================
; 🚀 โหมด Release (สำหรับ Flash ใช้งานจริง / อัปเดต OTA — เล็กที่สุด)
; ====================================================================
[env:release]
build_type = release
build_flags =
    ${env.build_flags}
    -DNDEBUG
    -DENABLE_DEBUG=0
    -Os
    -Wl,--gc-sections

; ====================================================================
; 🛠️ โหมด Debug (สำหรับเสียบสาย Serial พัฒนาและดู Exception Decoder)
; ====================================================================
[env:debug]
build_type = debug
monitor_filters = esp8266_exception_decoder, time
build_flags =
    ${env.build_flags}
    -DENABLE_DEBUG=1
    -DDEBUG_ESP_PORT=Serial

; คง env:geekmagic ไว้เพื่อความเข้ากันได้ย้อนหลังกับสคริปต์หรือคำสั่งเดิม
[env:geekmagic]
extends = env:release

