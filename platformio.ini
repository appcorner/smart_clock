; GeekMagic SmallTV — ESP8266 ESP-12F + ST7789 240x240 IPS
; ชิปบนบอร์ดคือ ESP8266 ESP-12F แฟลช 4MB จึงใช้ board = esp12e

[platformio]
; ซอร์สอยู่ในโฟลเดอร์เดิม เพื่อให้ยังเปิดด้วย Arduino IDE ได้ด้วย
src_dir = smart_clock_esp8266

[env:geekmagic]
platform = espressif8266
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L

; ไม่ใช้ filesystem เพราะหน้าเว็บฝังไว้ใน PROGMEM แล้ว
; แบ่ง 1MB ให้ FS ที่เหลือเป็น sketch space เพื่อให้ OTA มีที่พอ
board_build.ldscript = eagle.flash.4m1m.ld

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, time

upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit BusIO @ ^1.15.0

; หลัง build เสร็จ copy firmware.bin ไปไว้ที่ build_esp8266/ ตามที่ README อ้างถึง
extra_scripts = post:scripts/copy_firmware.py
